steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/linkchat-backend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/linkchat-backend:latest'
      - '.'
    dir: 'backend'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/linkchat-backend:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/linkchat-backend:latest'

  # Deploy container image to Cloud Run (minimal config)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      # Live production service (the one Netlify proxies to)
      - 'linkroom-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/linkchat-backend:$BUILD_ID'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      # WebSocket is one long-lived request; 300s killed every socket after
      # 5 min. 3600s (Cloud Run max) lets it live an hour. Keep one instance warm.
      - '--timeout'
      - '3600'
      - '--min-instances'
      - '1'
      # WebSockets hold a concurrency slot each; 250 keeps hundreds of mostly
      # idle sockets on one instance instead of scaling out at the default 80.
      - '--concurrency'
      - '250'
      - '--session-affinity'
      - '--set-env-vars'
      - 'PORT=8080,NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/linkchat-backend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/linkchat-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY

