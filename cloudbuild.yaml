steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/linkchat-backend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/linkchat-backend:latest'
      - '.'
    dir: 'backend'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/linkchat-backend:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/linkchat-backend:latest'

  # Deploy container image to Cloud Run.
  # This is the ONE canonical deploy config for `linkroom-backend` (asia-south1,
  # project linkchat-480712) — the service Netlify proxies to. `cloudbuild-simple.yaml`
  # and `cloudbuild-minimal.yaml` have been deleted; they had each drifted to
  # different flag values (memory, min/max-instances, concurrency,
  # --no-cpu-throttling) and none of the three matched what was actually
  # deployed. These flags were reconciled 2026-07-24 directly against
  # `gcloud run services describe linkroom-backend --region asia-south1`.
  #
  # If you change a flag here: deploy it, then re-run that `describe` command
  # to confirm the live service matches this file. Letting them drift apart
  # again is exactly the bug an audit had to find and fix once already.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'linkroom-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/linkchat-backend:$BUILD_ID'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      # Scale-to-zero is fine for the REST-API side of this service. The real
      # cost driver identified by the audit is that an open Socket.IO
      # connection is billed as continuously-active CPU for as long as it
      # stays connected — a property of running WebSockets on Cloud Run at
      # all, not of min-instances. Bumping this back to 1 buys a guaranteed-
      # warm instance at the (much cheaper) idle rate, but does not change how
      # a live socket is billed. If cold-start session drops become a problem,
      # that's a signal to move the realtime gateway off Cloud Run entirely
      # (see the cost audit's proposed architecture), not to raise this.
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      # A WebSocket is one long-lived HTTP request; Cloud Run's request
      # timeout applies to it. 300s force-closed every socket after 5 minutes.
      # 3600s (the Cloud Run max) lets a connection live an hour before a
      # client-side reconnect.
      - '--timeout'
      - '3600'
      - '--concurrency'
      - '100'
      # Doubles allocated CPU only during container startup (faster cold
      # starts at min-instances=0) — does not apply during steady-state
      # request handling, so it doesn't reintroduce the always-on-CPU cost
      # problem.
      - '--cpu-boost'
      - '--session-affinity'
      # --update-env-vars MERGES with whatever's already set on the service
      # (MONGO_URI, REDIS_URL, JWT_SECRET, GOOGLE_CLIENT_*, ADMIN_SECRET,
      # GCS_*, etc. — all configured directly on Cloud Run, not tracked here).
      # NEVER use --set-env-vars here — an earlier version of this file used
      # --set-env-vars with only NODE_ENV=production listed, which silently
      # wiped every other env var on deploy and took production down
      # (MongoDB/Redis both unreachable).
      - '--update-env-vars'
      - 'NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/linkchat-backend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/linkchat-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
