steps:
  # Build the container image
  # Use BUILD_ID which is always available (falls back to latest if needed)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/linkchat-backend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/linkchat-backend:latest'
      - '.'
    dir: 'backend'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/linkchat-backend:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/linkchat-backend:latest'

  # Deploy container image to Cloud Run.
  # NOTE: the live production service is `linkroom-backend` in asia-south1
  # (project linkchat-480712) — the service Netlify proxies to. This file
  # previously deployed a `linkchat-backend` service in us-central1 that does
  # not exist in production, so none of these settings ever reached prod.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'linkroom-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/linkchat-backend:$BUILD_ID'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      # Keep one instance warm so an active WebSocket's instance is never scaled
      # to zero (which would kill the connection and drop the Socket.IO session).
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      # A WebSocket is a single long-lived HTTP request; Cloud Run's request
      # timeout applies to it. 300s force-closed every socket after 5 minutes.
      # 3600s (the Cloud Run max) lets connections live an hour before a refresh.
      - '--timeout'
      - '3600'
      # Each open WebSocket occupies one concurrency slot for its lifetime. At
      # the default 80, ~400 connected users would spin up 5 instances, each
      # billing active CPU. 250 lets one 512Mi instance hold several hundred
      # mostly-idle sockets before scaling out.
      - '--concurrency'
      - '250'
      # Best-effort sticky sessions. Harmless with websocket-only, but protects
      # any polling handshake that still occurs (e.g. a dev client hitting prod).
      - '--session-affinity'
      - '--set-env-vars'
      # PORT is a Cloud Run-reserved env var (implied by --port above) — the
      # platform now rejects deploys that try to set it explicitly, which was
      # silently blocking every deploy through this pipeline.
      - 'NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/linkchat-backend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/linkchat-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

